<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:540px;height:540px;background:#F4F6FA;font-family:'Inter Display','Inter',sans-serif;
       overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
  .halo{position:absolute;width:430px;height:430px;border-radius:50%;
        background:radial-gradient(circle, rgba(255,77,0,.22), rgba(255,77,0,0) 68%);filter:blur(10px);}
  .frio{position:absolute;width:300px;height:300px;border-radius:50%;top:-90px;right:-70px;
        background:radial-gradient(circle, rgba(110,140,255,.13), rgba(110,140,255,0) 70%);filter:blur(20px);}
  .grade{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(#E7EBF2 1px,transparent 1px),linear-gradient(90deg,#E7EBF2 1px,transparent 1px);
    background-size:45px 45px;
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 10%, transparent 72%);}

  .palco{position:relative;perspective:1400px;}
  .ticket{position:relative;width:434px;height:206px;
    transform:rotateX(11deg) rotateY(-9deg) rotateZ(-2deg);
    filter:drop-shadow(0 30px 38px rgba(180,65,18,.30)) drop-shadow(0 6px 10px rgba(15,11,26,.14));}
  .face{position:absolute;inset:0;border-radius:20px;overflow:hidden;display:flex;
    -webkit-mask-image:
      radial-gradient(circle 14px at 136px 0, transparent 98%, #000 100%),
      radial-gradient(circle 14px at 136px 206px, transparent 98%, #000 100%);
    -webkit-mask-composite:source-in; mask-composite:intersect;}
  .stub{width:136px;height:100%;background:linear-gradient(155deg,#FF6A1F,#F14100);}
  .corpo{flex:1;height:100%;background:linear-gradient(130deg,#FF5207 0%,#FF6A1F 48%,#FF8C42 100%);position:relative;}
  .circ{position:absolute;inset:0;opacity:.13;
    background-image:linear-gradient(90deg,#fff 1.4px,transparent 1.4px),linear-gradient(0deg,#fff 1.4px,transparent 1.4px);
    background-size:28px 28px;}
  .brilho{position:absolute;top:-70%;left:-25%;width:62%;height:240%;transform:rotate(17deg);
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.26),rgba(255,255,255,0));}
  .topo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,0) 42%);}

  .conteudo{position:relative;display:flex;width:100%;height:100%;color:#fff;}
  .canhoto{width:136px;display:flex;align-items:center;justify-content:center;}
  .canhoto span{transform:rotate(-90deg);white-space:nowrap;font-weight:800;font-size:18px;
    letter-spacing:8px;text-transform:uppercase;}
  .picote{position:absolute;left:136px;top:15px;bottom:15px;border-left:2.5px dashed rgba(255,255,255,.60);}
  .dados{flex:1;padding:21px 30px 19px 25px;display:flex;flex-direction:column;justify-content:space-between;}
  .rot{font-size:11px;font-weight:700;letter-spacing:2.8px;text-transform:uppercase;opacity:.93;}
  .valor{font-size:72px;font-weight:900;line-height:.9;letter-spacing:-3.5px;text-shadow:0 2px 0 rgba(150,45,5,.20);}
  .valor small{font-size:28px;font-weight:800;vertical-align:super;letter-spacing:-1px;margin-right:4px;}
  .uso{font-size:15px;font-weight:700;opacity:.98;margin-top:-2px;}
  .rodape{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .rodape img{height:22px;}
  .evt{font-size:9.5px;font-weight:600;opacity:.9;text-align:right;line-height:1.35;letter-spacing:.2px;}
  .chao{position:absolute;left:50%;top:calc(50% + 142px);transform:translateX(-50%);width:330px;height:34px;
    background:radial-gradient(ellipse at center, rgba(180,65,18,.26), rgba(180,65,18,0) 72%);filter:blur(8px);}
</style></head><body>
